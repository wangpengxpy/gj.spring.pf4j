server:
  address: 0.0.0.0
  port: 9000
spring:
  mvc:
    path-match:
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      url: jdbc:sqlite:./gj.db
      driver-class-name: org.sqlite.JDBC
      db-type: com.alibaba.druid.pool.DruidDataSource
      initialSize: 5
      minIdle: 10
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: -1
    use-code-as-default-message: false
  security:
    user:
      name: admin
      password: admin
mybatis-plus:
  global-config:
    banner: false
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    org.springframework.security.web: DEBUG
    org.springframework.context.annotation: DEBUG
spring-doc:
  remove-broken-reference-definitions: false
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: OPENAPI_3_0
    path-sorting: alpha
  swagger-ui:
    default-models-expand-depth: -1
    doc-expansion: none
    tryItOutEnabled: true
    filter: false
    display-request-duration: true
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    groups-order: DESC
gj:
  socketio:
    enabled: false            # Disabled by default, set true to enable
    port: 9600
    boss-thread-count: 1
    upgrade-timeout: 10000    # HTTP→WebSocket upgrade timeout (ms)
    ping-timeout: 60000       # Ping timeout (ms)
    ping-interval: 30000      # Ping interval (ms)
    max-connections: 50000    # Max concurrent connections
    max-frame-payload-length: 64    # Max WebSocket frame payload (KB)
    max-http-content-length: 64     # Max HTTP polling body (KB)
    max-connections-per-second: 100 # Max connection rate per second
    node-id: ${HOSTNAME:}     # Cluster node ID, auto-detected from HOSTNAME when empty
    connection-ttl: 3600      # Connection mapping Redis key TTL (seconds)
    cluster:
      enabled: false          # Cluster mode, requires Redis
  # ─── Plugin Authentication ──────────────────────────────────────────
  # Filter extensions are disabled by default — enable per-position, per-plugin.
  # Authentication SPI (IPluginAuthenticationProvider) requires no configuration.
  security:
    filter:
      enabled: true
      allowed-positions: FIRST, LAST
    plugins:
      gj.plugin.demo:
        filter:
          allowed-positions: FIRST, LAST
